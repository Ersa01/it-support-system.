{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
  <div class="card border-0 shadow-sm"><div class="card-body p-4">
    <h2 class="fw-bold mb-4">{{ page_title }}</h2>
    <form method="post">{% csrf_token %}
      {% for field in form %}
        <div class="mb-3"><label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small mt-1">{{ field.errors|striptags }}</div>{% endif %}</div>
      {% endfor %}
      <button class="btn btn-primary" type="submit">Сақтау</button>
      <a class="btn btn-light" href="{% url 'ticket_list' %}">Артқа</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
